<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Innovation Widget | AI Cockpit</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body {
      background: transparent !important;
      margin: 0;
      padding: 4px;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
    .mobile-widget-card {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      background: rgba(10, 15, 24, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="mobile-widget-card" id="feed-widget-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-family:var(--font-heading); font-size:0.85rem; font-weight:700;">INNOVATION FEED</span>
      <span class="spotlight-mini-tag" id="feed-tag">#AI • LATEST</span>
    </div>

    <div style="font-size:0.85rem; font-weight:600; line-height:1.4; color:var(--text-primary);" id="feed-title">
      Loading latest breakthroughs...
    </div>

    <div style="font-size:0.75rem; color:var(--text-secondary); line-height:1.4;" id="feed-summary">
      Connecting to AI Cockpit intelligence server...
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.65rem; color:var(--text-muted); font-family:var(--font-mono); border-top:1px solid var(--border-glass); padding-top:8px;">
      <span id="feed-source">arXiv</span>
      <span style="color:var(--accent-color);">Tap to Open →</span>
    </div>
  </div>

  <script>
    let feeds = [];
    let idx = 0;
    async function load() {
      try {
        const res = await fetch('/api/feeds');
        const data = await res.json();
        feeds = data.feeds || [];
        render();
      } catch (e) {}
    }
    function render() {
      if (!feeds.length) return;
      const f = feeds[idx % feeds.length];
      document.getElementById('feed-tag').textContent = `#${f.category.toUpperCase()} • LATEST`;
      document.getElementById('feed-title').textContent = f.title;
      document.getElementById('feed-summary').textContent = f.summary || '';
      document.getElementById('feed-source').textContent = `${f.source} • ${f.timestamp}`;
      document.getElementById('feed-widget-card').onclick = () => {
        if (f.url && f.url !== '#') window.open(f.url, '_blank');
        else window.location.href = '/';
      };
    }
    load();
    // Auto-cycle every 12s
    setInterval(() => {
      if (feeds.length > 1) {
        idx++;
        render();
      }
    }, 12000);
  </script>
</body>
</html>
